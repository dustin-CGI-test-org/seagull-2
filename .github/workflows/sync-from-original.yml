# NEW repo: .github/workflows/sync-from-original.yml
#
# Runs when the original repo reports a change to the subdirectory. It clones
# the original, re-splits the subdirectory history, and merges it into this
# repo UNDER A FOLDER (TARGET_DIR) with `git subtree merge`, so the folder itself
# is kept rather than its contents landing at the repo root.
# Authenticates as a GitHub App for both the clone and the push.
#
# This file must be on the new repo's DEFAULT branch, or the
# repository_dispatch event will not trigger it.
#
# Seeding: the first run seeds itself. If TARGET_BRANCH doesn't exist yet it
# is created from PR_BASE_BRANCH, and if TARGET_DIR doesn't exist on it the
# folder is imported with full history via `git subtree add`. Every later run
# does a `git subtree merge` on top of that import.
#
# Setup:
#   1. Replace the values marked CHANGE ME below.
#   2. Make these available to this repo (repo-level, or org-level limited
#      to the two repos):
#        variable  SUBDIR_SYNC_APP_CLIENT_ID    the App's Client ID
#        secret    SUBDIR_SYNC_APP_PRIVATE_KEY  full contents of the App's .pem key
#   3. The App needs "Contents: Read and write" and "Pull requests: Read and
#      write", and must be installed on both repos.
#
# After pushing, it opens a PR from TARGET_BRANCH into PR_BASE_BRANCH if one
# isn't already open. Merge it with a merge commit (not squash or rebase), and
# don't delete TARGET_BRANCH afterwards.

name: Sync from original repo

on:
  repository_dispatch:
    types: [subdir-updated]
  workflow_dispatch:                       # lets you run a sync by hand

permissions: {}                            # the built-in GITHUB_TOKEN is not used

concurrency:
  group: subdir-sync                       # never run two syncs at once
  cancel-in-progress: false

env:
  SOURCE_REPO: dustin-CGI-test-org/seagull
  SOURCE_BRANCH: develop
  SOURCE_DIR: subdir
  TARGET_DIR: subdir
  TARGET_BRANCH: sync-branch
  PR_BASE_BRANCH: develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create a GitHub App token for both repos
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SUBDIR_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBDIR_SYNC_APP_PRIVATE_KEY }}
          repositories: |
            ${{ env.SOURCE_REPO }}
            ${{ github.repository }}
          permission-contents: write       # read the original, push to this repo
          permission-pull-requests: write  # open the sync PR

      - name: Look up the App's bot user ID (for commit attribution)
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Check out the original repo with full history
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0                   # subtree split needs every commit
          path: source
          persist-credentials: false

      - name: Split out the subdirectory history
        working-directory: source
        run: git subtree split --prefix="$SOURCE_DIR" -b subdir-split

      - name: Check out this repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}   # push as the App
          fetch-depth: 0                   # full history and all branches
          path: target

      - name: Switch to the sync branch (creating it if needed)
        working-directory: target
        run: |
          if git rev-parse --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}" >/dev/null; then
            git checkout -B "$TARGET_BRANCH" "origin/${TARGET_BRANCH}"
          else
            echo "$TARGET_BRANCH doesn't exist yet; creating it from $PR_BASE_BRANCH."
            git checkout -B "$TARGET_BRANCH" "origin/${PR_BASE_BRANCH}"
          fi

      - name: Import or merge the split history into the folder and push
        working-directory: target
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user-id }}
        run: |
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch ../source subdir-split

          if [ ! -d "$TARGET_DIR" ]; then
            # First run: import the folder with its full history.
            echo "$TARGET_DIR doesn't exist yet; seeding it with git subtree add."
            git subtree add --prefix="$TARGET_DIR" FETCH_HEAD \
              -m "Add $TARGET_DIR from $SOURCE_REPO@$SOURCE_BRANCH"
          elif git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date; nothing to sync."
          else
            # Merges the new commits into TARGET_DIR/ (always a merge commit).
            # A conflict fails the job so you can resolve it by hand.
            git subtree merge --prefix="$TARGET_DIR" FETCH_HEAD \
              -m "Sync $TARGET_DIR from $SOURCE_REPO@$SOURCE_BRANCH"
          fi

          # Also creates the branch on the remote the first time.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      # Runs even when the previous step found nothing new, so a PR that failed
      # to open on an earlier run still gets opened.
      - name: Open a PR into the base branch if needed
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin "$PR_BASE_BRANCH"

          ahead=$(git rev-list --count "origin/${PR_BASE_BRANCH}..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "$TARGET_BRANCH has nothing that $PR_BASE_BRANCH doesn't; no PR needed."
            exit 0
          fi

          open=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$TARGET_BRANCH" --base "$PR_BASE_BRANCH" \
            --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "A PR from $TARGET_BRANCH into $PR_BASE_BRANCH is already open; it now includes the new commits."
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$TARGET_BRANCH" --base "$PR_BASE_BRANCH" \
            --title "Sync $TARGET_DIR from $SOURCE_REPO@$SOURCE_BRANCH" \
            --body "Automated sync of \`$SOURCE_DIR\` from \`$SOURCE_REPO\` (\`$SOURCE_BRANCH\`) into \`$TARGET_DIR\`.

          **Merge with a merge commit** (not squash or rebase), and keep \`$TARGET_BRANCH\` after merging, or later syncs will conflict."
