# NEW repo: .github/workflows/sync-from-original.yml
#
# Runs when the original repo reports a change to the subdirectory. It clones
# the original, re-splits the subdirectory history, and merges it into this
# repo (a fast-forward when this repo has no commits of its own).
# Authenticates as a GitHub App for both the clone and the push.
#
# This file must be on the new repo's DEFAULT branch, or the
# repository_dispatch event will not trigger it.
#

name: Sync from original repo

on:
  repository_dispatch:
    types: [subdir-updated]
  workflow_dispatch:                       # lets you run a sync by hand

permissions: {}                            # the built-in GITHUB_TOKEN is not used

concurrency:
  group: subdir-sync                       # never run two syncs at once
  cancel-in-progress: false

env:
  SOURCE_REPO: dustin-CGI-test-org/seagull
  SOURCE_BRANCH: develop
  SUBDIR: subdir
  TARGET_BRANCH: sync-branch
  PR_BASE: develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create a GitHub App token for both repos
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SUBDIR_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBDIR_SYNC_APP_PRIVATE_KEY }}
          repositories: |
            ${{ env.SOURCE_REPO }}
            ${{ github.repository }}
          permission-contents: write       # read the original, push to this repo
          permission-pull-requests: write  # open the PR into PR_BASE

      - name: Look up the App's bot user ID (for commit attribution)
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Check out the original repo with full history
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0                   # subtree split needs every commit
          path: source
          persist-credentials: false

      - name: Split out the subdirectory history
        working-directory: source
        run: git subtree split --prefix="$SUBDIR" -b subdir-split

      # Checks out the default branch, which always exists. fetch-depth: 0
      # also fetches every other branch, so the next step can tell whether
      # TARGET_BRANCH exists yet.
      - name: Check out this repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}   # push as the App
          fetch-depth: 0
          path: target

      - name: Merge the split history and push
        working-directory: target
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user-id }}
        run: |
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch ../source subdir-split

          # If the target branch doesn't exist, create it from the split
          # and stop; there is nothing to merge into.
          if ! git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            echo "Branch '${TARGET_BRANCH}' not found; creating it from the split."
            git push origin "FETCH_HEAD:refs/heads/${TARGET_BRANCH}"
            exit 0
          fi

          git checkout -B "$TARGET_BRANCH" "origin/${TARGET_BRANCH}"

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date; nothing to sync."
            exit 0
          fi

          # Fast-forwards when possible; otherwise creates a merge commit.
          # A conflict fails the job so you can resolve it by hand.
          git merge --no-edit FETCH_HEAD
          git push origin "HEAD:${TARGET_BRANCH}"

      # Runs even when the step above found nothing new, so a missing PR is
      # always opened if TARGET_BRANCH has commits PR_BASE doesn't.
      - name: Open a pull request into the base branch
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin "$PR_BASE" "$TARGET_BRANCH"

          ahead=$(git rev-list --count "origin/${PR_BASE}..origin/${TARGET_BRANCH}")
          if [ "$ahead" -eq 0 ]; then
            echo "'${PR_BASE}' already has everything in '${TARGET_BRANCH}'; no PR needed."
            exit 0
          fi

          open=$(gh pr list --repo "$REPO" --head "$TARGET_BRANCH" --base "$PR_BASE" \
                   --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "A pull request is already open; it now includes the new commits."
            exit 0
          fi

          gh pr create --repo "$REPO" \
            --head "$TARGET_BRANCH" --base "$PR_BASE" \
            --title "Sync ${SUBDIR} from ${SOURCE_REPO}" \
            --body "Automated sync of \`${SUBDIR}\` from ${SOURCE_REPO} (\`${SOURCE_BRANCH}\`)."
